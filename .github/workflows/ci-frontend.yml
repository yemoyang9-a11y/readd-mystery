# 프론트엔드 PR 검증: 린트·단위 시험·빌드·휴대폰/PC 브라우저 시험.
# 운영 배포는 main 전용 deploy-frontend.yml에서 별도로 수행한다.

name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 빌드·테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Node 22 가 기본 번들하는 npm 10.x 에는 `npm ci` + optionalDependencies(플랫폼별
      # esbuild 바이너리 등) 조합에서 EBADPLATFORM 오탐이 나는 회귀가 있다 — 자기
      # 플랫폼에 안 맞아 건너뛰어야 할 패키지를 설치하려다 실패한다. npm 11 에서는
      # 재현되지 않는다(로컬에서 npm 10.9.2/11.12.1 로 동일 lockfile 재현·비교 확인,
      # 2026-08-23). lockfile 문제가 아니라 npm 버전 문제라 lockfile 은 건드리지 않는다.
      - name: Update npm (npm 10.x npm-ci EBADPLATFORM 회귀 회피)
        run: npm install -g npm@11

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        working-directory: frontend
        run: npm test -- --maxWorkers=2

      # CI 산출물은 배포하지 않는다. 운영 번들은 배포 워크플로에서 설정을 받아 빌드한다.
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Install smoke browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Mobile and desktop smoke tests
        working-directory: frontend
        run: npm run e2e:smoke

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-diagnostics
          path: frontend/test-results/
          retention-days: 7
