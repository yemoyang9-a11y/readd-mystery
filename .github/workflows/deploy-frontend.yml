# 프론트엔드 배포 — Cloudflare Pages (2026-11-17 대표 지시: 화면 배포 자동화)
#
# main 에 frontend/ 변경이 들어오면 테스트·빌드 후 Cloudflare Pages 에 올린다.
# Pages 의 Git 연동 대신 여기서 올리는 이유: 피벗 후 저장소(readd-mystery)가 Pages 프로젝트에
# 연동돼 있지 않아 main 에 병합해도 화면이 바뀌지 않았다.
#
# 주소·프로젝트 이름은 파일에 적지 않고 저장소 설정에서 읽는다(예전 워크플로가 VITE_API_URL 을
# 파일에 하드코딩했던 문제를 되풀이하지 않는다).
#
# ⚠️ 저장소 → Settings → Secrets and variables → Actions 에 등록해야 동작한다. 없으면 배포 단계는
#    건너뛰고 이유를 로그에 남긴다(테스트·빌드는 그대로 돈다).
#    Secrets   : CLOUDFLARE_API_TOKEN   (권한: Account → Cloudflare Pages → Edit)
#                CLOUDFLARE_ACCOUNT_ID
#    Variables : CLOUDFLARE_PAGES_PROJECT  (Pages 프로젝트 이름)
#                VITE_API_URL              (예: https://<fly-app-이름>.fly.dev — 끝에 /api 붙이지 않는다)

name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 테스트·빌드·배포
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_USE_MOCK: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update npm (npm 10.x npm-ci EBADPLATFORM 회귀 회피)
        run: npm install -g npm@11

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 테스트가 깨진 화면은 배포하지 않는다
      - name: Test
        working-directory: frontend
        run: npm test

      - name: 배포 설정 확인
        id: config
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN(secret)"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID(secret)"
          [ -n "$PAGES_PROJECT" ] || missing="$missing CLOUDFLARE_PAGES_PROJECT(variable)"
          [ -n "$VITE_API_URL" ] || missing="$missing VITE_API_URL(variable)"
          if [ -n "$missing" ]; then
            echo "::warning::배포를 건너뜁니다. 저장소 설정에 없는 값:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.config.outputs.ready == 'true'
        working-directory: frontend
        run: npm run build

      - name: Cloudflare Pages 배포
        if: steps.config.outputs.ready == 'true'
        working-directory: frontend
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
